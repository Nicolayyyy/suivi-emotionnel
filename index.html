<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>État émotionnel</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,460px);background:#172235;border:1px solid #344156;border-radius:24px;padding:25px;box-shadow:0 20px 55px #0004}h1{font-size:27px;margin:0 0 10px}p{color:#b9c4d5;line-height:1.5}.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:24px 0}.scale button{border:1px solid #43536a;border-radius:12px;background:#253349;color:white;font-size:17px;padding:13px 0}.scale button.active{background:#60a5fa;color:#07101e;border-color:#93c5fd;font-weight:800}.scale button:focus-visible,.send:focus-visible{outline:3px solid white;outline-offset:2px}label{display:block;font-weight:600;margin:20px 0 8px}textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid #46566d;background:#0e192a;color:white;font:inherit;padding:12px;resize:vertical}.send{width:100%;border:0;border-radius:12px;background:#60a5fa;color:#08111f;padding:16px;font-size:17px;font-weight:750;margin-top:18px}.send:disabled{opacity:.55}.note{font-size:13px;color:#aebcd0}#status{min-height:25px}#status.error{color:#fda4af}#status.ok{color:#86efac}
</style></head><body><main><h1>Comment te sens-tu ?</h1><p>Note ton état émotionnel <strong>maintenant</strong>, de −5 (très négatif) à +5 (très positif).</p><div class="scale" id="scale" role="group" aria-label="Note émotionnelle"></div><label for="context">Que fais-tu actuellement ? <span class="note">(facultatif)</span></label><textarea id="context" maxlength="300" placeholder="Ex. : travail, sport, repos, appel…"></textarea><button class="send" id="send" disabled>Enregistrer ma réponse</button><p id="status" role="status" aria-live="polite"></p><p class="note">L'heure enregistrée sera celle de l'envoi. Ne saisis pas de données sensibles dans le contexte.</p></main><iframe name="submit_frame" id="submit_frame" hidden title="Transmission"></iframe><form id="submit_form" target="submit_frame" method="POST" hidden><input name="note" id="form_note"><input name="contexte" id="form_context"></form><script>
// CONFIGURATION : remplace uniquement l’URL ci-dessous avant publication.
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzVGiD7ZTManLuZo2z5XxdFjq2mCpKFfU_XM-J1J6PKbwZbwXbYhpxLdvxyiAwlQywjfA/exec';
let selected=null;const scale=document.querySelector('#scale'),send=document.querySelector('#send'),status=document.querySelector('#status');
for(let i=-5;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent=i>0?'+'+i:String(i);b.setAttribute('aria-pressed','false');b.onclick=()=>{selected=i;for(const x of scale.children){x.classList.remove('active');x.setAttribute('aria-pressed','false')}b.classList.add('active');b.setAttribute('aria-pressed','true');send.disabled=false};scale.appendChild(b)}
const form=document.querySelector('#submit_form');send.onclick=()=>{if(selected===null)return;if(!SCRIPT_URL.startsWith('https://script.google.com/macros/s/')||!SCRIPT_URL.endsWith('/exec')){status.className='error';status.textContent='Configure d’abord l’URL Apps Script dans index.html.';return}form.action=SCRIPT_URL;document.querySelector('#form_note').value=selected;document.querySelector('#form_context').value=document.querySelector('#context').value;send.disabled=true;status.className='';status.textContent='Envoi demandé… Vérifie la nouvelle ligne dans Google Sheets.';form.submit();setTimeout(()=>{status.textContent='Demande envoyée. Vérifie dans Google Sheets que la ligne a bien été ajoutée avant de réessayer. Recharge la page pour saisir une nouvelle réponse.'},2200)};
</script></body></html>
